name: Update GitHub Streak

on:
  schedule:
    - cron: "0 1 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: 'user=Bhagyashri71&theme=dark&background=0D1117&ring=FF69B4&fire=FF69B4&currStreakNum=58D9FF&sideNums=FF69B4&currStreakLabel=58D9FF&sideLabels=FF69B4&dates=FFFFFF&hide_border=false&disable_animations=false'
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/streak.svg

          git diff --cached --quiet || git commit -m "Update GitHub streak"

          git push
